name: Nightly

permissions:
  contents: read

on:
  schedule:
    # 03:17 UTC daily. Offset from the hour to avoid GitHub Actions cron-hour pile-up.
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  ROTIDE_METRICS_GIT_SHA: ${{ github.sha }}
  ROTIDE_METRICS_GIT_REF: ${{ github.ref }}
  ROTIDE_METRICS_CI_RUN_ID: ${{ github.run_id }}

jobs:
  tsan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run TSan suite
        run: make test-tsan

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: tsan-artifacts
          path: tests/artifacts/
          if-no-files-found: ignore

  quarantine-passing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check no quarantined test now passes
        run: make test-quarantine-passing

  fuzz-nightly:
    # 30-minute soak per target (FUZZ_NIGHTLY_TIME=1800 by default in the
    # Makefile). The corpus_grown directory is restored from cache, libFuzzer
    # adds new finds in place, and the cache is saved back at the end of the
    # job so each nightly run starts where the previous one left off.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: vterm
            make: fuzz-vterm-nightly
            dir: tests/fuzz/vterm/corpus_grown
          - name: lsp
            make: fuzz-lsp-nightly
            dir: tests/fuzz/lsp/corpus_grown
          - name: dap
            make: fuzz-dap-nightly
            dir: tests/fuzz/dap/corpus_grown
          - name: toml-theme
            make: fuzz-toml-theme-nightly
            dir: tests/fuzz/toml/corpus_grown
    env:
      ASAN_OPTIONS: detect_leaks=0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Restore grown corpus
        uses: actions/cache/restore@v5
        with:
          path: ${{ matrix.target.dir }}
          key: fuzz-${{ matrix.target.name }}-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-${{ matrix.target.name }}-corpus-

      - name: Run nightly fuzz soak
        run: make ${{ matrix.target.make }} METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-fuzz-${{ matrix.target.name }}-nightly
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Save grown corpus
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ matrix.target.dir }}
          key: fuzz-${{ matrix.target.name }}-corpus-${{ github.run_id }}

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-${{ matrix.target.name }}-nightly-crashes
          path: crash-*
          if-no-files-found: ignore

  metrics-summary:
    if: always()
    needs:
      - fuzz-nightly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build summarizer
        run: make tests/metrics_summary

      - name: Download nightly fuzz metrics
        uses: actions/download-artifact@v8
        with:
          pattern: metrics-fuzz-*-nightly
          path: ci-metrics
        continue-on-error: true

      - name: Merge per-target rows
        run: |
          mkdir -p tests
          : > tests/metrics.jsonl
          for f in ci-metrics/metrics-fuzz-*-nightly/metrics.jsonl; do
            [ -f "$f" ] && cat "$f" >> tests/metrics.jsonl
          done

      # Restore by prefix to find the latest rolling history. Deduping on
      # ci_run_id keeps workflow reruns from counting the same rows twice.
      - name: Restore metrics history
        uses: actions/cache/restore@v5
        with:
          path: tests/metrics-history.jsonl
          key: metrics-history-${{ github.run_id }}
          restore-keys: |
            metrics-history-

      - name: Append run rows to history
        run: |
          touch tests/metrics-history.jsonl
          grep -v "\"ci_run_id\":\"${{ github.run_id }}\"" tests/metrics-history.jsonl \
              > tests/metrics-history.tmp || true
          mv tests/metrics-history.tmp tests/metrics-history.jsonl
          cat tests/metrics.jsonl >> tests/metrics-history.jsonl
          echo "history row count: $(wc -l < tests/metrics-history.jsonl)"

      - name: Save metrics history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: tests/metrics-history.jsonl
          key: metrics-history-${{ github.run_id }}

      - name: Summary (rolling history)
        run: ./tests/metrics_summary summary --in tests/metrics-history.jsonl

      # Surface noisy-baseline alerts as GitHub annotations without failing
      # the nightly cron.
      - name: Check fuzz staleness (48h window)
        run: |
          ./tests/metrics_summary check-fuzz-stale --in tests/metrics-history.jsonl \
              --window-hours 48 \
            || echo "::warning::check-fuzz-stale flagged a target — see job log"

      - name: Check bench regressions (3× IQR)
        run: |
          ./tests/metrics_summary check-bench-regression --in tests/metrics-history.jsonl \
            || echo "::warning::check-bench-regression flagged a bench — see job log"

      - name: Upload merged metrics (this run)
        uses: actions/upload-artifact@v7
        with:
          name: metrics-merged-nightly
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload rolling history
        uses: actions/upload-artifact@v7
        with:
          name: metrics-history-nightly
          path: tests/metrics-history.jsonl
          if-no-files-found: ignore
