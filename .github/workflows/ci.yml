name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

# Metrics emitters use these to tag rows with the workflow that produced them.
env:
  ROTIDE_METRICS_GIT_SHA: ${{ github.sha }}
  ROTIDE_METRICS_GIT_REF: ${{ github.ref }}
  ROTIDE_METRICS_CI_RUN_ID: ${{ github.run_id }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: make

      - name: Run test suite
        run: make test METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-build-and-test
          path: tests/metrics.jsonl
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install LLVM 22 lint tools
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb https://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" \
            | sudo tee /etc/apt/sources.list.d/llvm-22.list
          sudo apt-get update
          sudo apt-get install -y clang-format-22 clang-tidy-22

      - name: Run lint gates
        run: make lint-check CLANG_FORMAT=clang-format-22 CLANG_TIDY=clang-tidy-22

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run sanitizer suite
        run: make test-sanitize

  determinism:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run determinism gate
        run: make test-determinism

      - name: Upload determinism artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: determinism-artifacts
          path: tests/artifacts/determinism/
          if-no-files-found: ignore

  crash-handler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run crash-handler smoke
        run: make test-crash-handler

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-artifacts
          path: tests/artifacts/
          if-no-files-found: ignore

  fuzz-vterm-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_VTERM_SMOKE_RUNS: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run vterm fuzz smoke
        run: make fuzz-vterm-smoke METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-fuzz-vterm-smoke
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-vterm-crashes
          path: crash-*
          if-no-files-found: ignore

  fuzz-lsp-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_LSP_SMOKE_RUNS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run LSP framing fuzz smoke
        run: make fuzz-lsp-smoke METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-fuzz-lsp-smoke
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-lsp-crashes
          path: crash-*
          if-no-files-found: ignore

  fuzz-dap-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_DAP_SMOKE_RUNS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run DAP framing fuzz smoke
        run: make fuzz-dap-smoke METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-fuzz-dap-smoke
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-dap-crashes
          path: crash-*
          if-no-files-found: ignore

  fuzz-toml-theme-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_TOML_THEME_SMOKE_RUNS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run TOML theme fuzz smoke
        run: make fuzz-toml-theme-smoke METRICS_OUT=tests/metrics.jsonl

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-fuzz-toml-theme-smoke
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-toml-theme-crashes
          path: crash-*
          if-no-files-found: ignore

  loc:
    # Lines-of-code trend, sampled per push to main only (event-driven, not
    # nightly) so an idle period adds no points and never paints a flat line.
    # PRs and other branches are excluded so the trend tracks the mainline
    # history, not in-flight work. count_loc.sh skips emission when no tracked
    # source changed since the previous sample.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history so churn/dedup can diff HEAD against the push's base.
          fetch-depth: 0

      - name: Install cloc
        run: sudo apt-get update && sudo apt-get install -y cloc

      - name: Count lines of code
        run: make loc METRICS_OUT=tests/metrics.jsonl
        env:
          # The SHA before this push; absent on PRs, where the script falls
          # back to HEAD~1. Blank/zero (new branch) → first sample, zero churn.
          ROTIDE_LOC_BASE_SHA: ${{ github.event.before }}

      - name: Upload metrics row
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metrics-loc
          path: tests/metrics.jsonl
          if-no-files-found: ignore

  metrics-summary:
    if: always()
    needs:
      - build-and-test
      - fuzz-vterm-smoke
      - fuzz-lsp-smoke
      - fuzz-dap-smoke
      - fuzz-toml-theme-smoke
      - loc
    runs-on: ubuntu-latest
    # contents: write is needed to push SVG dashboards to the metrics-assets
    # orphan branch. Fork PRs receive a read-only token regardless and skip
    # the publish step by event-name guard below.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build summarizer
        run: make build/tests/metrics_summary

      - name: Download all metrics artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: metrics-*
          path: ci-metrics
        continue-on-error: true

      - name: Merge per-job rows
        run: |
          mkdir -p tests
          : > tests/metrics.jsonl
          for f in ci-metrics/metrics-*/metrics.jsonl; do
            [ -f "$f" ] && cat "$f" >> tests/metrics.jsonl
          done

      # Restore by prefix to find the latest rolling history. Deduping on
      # ci_run_id keeps workflow reruns from counting the same rows twice.
      - name: Restore metrics history
        uses: actions/cache/restore@v5
        with:
          path: tests/metrics-history.jsonl
          key: metrics-history-${{ github.run_id }}
          restore-keys: |
            metrics-history-

      - name: Append run rows to history
        run: |
          touch tests/metrics-history.jsonl
          grep -v "\"ci_run_id\":\"${{ github.run_id }}\"" tests/metrics-history.jsonl \
              > tests/metrics-history.tmp || true
          mv tests/metrics-history.tmp tests/metrics-history.jsonl
          cat tests/metrics.jsonl >> tests/metrics-history.jsonl
          echo "history row count: $(wc -l < tests/metrics-history.jsonl)"

      - name: Save metrics history
        if: always()
        uses: actions/cache/save@v5
        with:
          path: tests/metrics-history.jsonl
          key: metrics-history-${{ github.run_id }}

      - name: Summary (this workflow)
        run: ./build/tests/metrics_summary summary --in tests/metrics.jsonl

      - name: Render SVG dashboard
        run: |
          mkdir -p build/metrics/svg
          ./build/tests/metrics_summary render-svg \
            --in tests/metrics-history.jsonl \
            --out-dir build/metrics/svg
          ls -la build/metrics/svg/

      # Push SVGs to the metrics-assets orphan branch so they have stable
      # HTTPS URLs that GitHub markdown can embed via Camo. Two destinations:
      #   runs/<sha>/   — immutable per-commit copy, used by this run's step
      #                   summary so embeds never go stale.
      #   latest/       — mutable pointer to the latest main run, embedded
      #                   from docs/developer/testing.md for the dev dashboard.
      # Fork PRs hold a read-only token and skip this step.
      - name: Publish SVGs to metrics-assets branch
        id: publish
        if: |
          github.event_name == 'push' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          UPDATE_LATEST: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ ! -d build/metrics/svg ] || ! compgen -G "build/metrics/svg/*.svg" > /dev/null; then
            echo "No SVGs to publish; skipping."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          SRC="$GITHUB_WORKSPACE/build/metrics/svg"
          WORK=$(mktemp -d)
          cd "$WORK"
          git init -q -b metrics-assets
          git remote add origin "$REMOTE"
          if git fetch --depth=1 origin metrics-assets 2>/dev/null; then
            git reset --hard FETCH_HEAD
          fi

          mkdir -p "runs/${SHA}"
          cp "$SRC"/*.svg "runs/${SHA}/"

          if [ "$UPDATE_LATEST" = "true" ]; then
            rm -rf latest
            mkdir -p latest
            cp "$SRC"/*.svg latest/
          fi

          git add -A
          if git diff --cached --quiet; then
            echo "No SVG changes."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "metrics: dashboard SVGs for ${SHA}"
            git push origin metrics-assets
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Append dashboard to step summary
        env:
          SHA: ${{ github.sha }}
          PUBLISHED: ${{ steps.publish.outputs.published || 'false' }}
        run: |
          if [ ! -d build/metrics/svg ] || ! compgen -G "build/metrics/svg/*.svg" > /dev/null; then
            echo "No SVG charts rendered (history likely empty); skipping summary section."
            exit 0
          fi
          REPO="${{ github.repository }}"
          if [ "$PUBLISHED" = "true" ]; then
            BASE="runs/${SHA}"
            CAPTION="Charts for this run (commit \`${SHA:0:7}\`)."
          else
            BASE="latest"
            CAPTION="This run did not publish SVGs (fork PR or no new chart data). Showing latest main as baseline."
          fi
          {
            echo "## CI metrics"
            echo ""
            echo "$CAPTION"
            echo ""
            for f in build/metrics/svg/*.svg; do
              name=$(basename "$f")
              echo "![${name%.svg}](https://raw.githubusercontent.com/${REPO}/metrics-assets/${BASE}/${name})"
              echo ""
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged metrics (this workflow)
        uses: actions/upload-artifact@v7
        with:
          name: metrics-merged
          path: tests/metrics.jsonl
          if-no-files-found: ignore

      - name: Upload rolling history
        uses: actions/upload-artifact@v7
        with:
          name: metrics-history
          path: tests/metrics-history.jsonl
          if-no-files-found: ignore
