name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Run test suite
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run sanitizer suite
        run: make test-sanitize

  determinism:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run determinism gate
        run: make test-determinism

  crash-handler:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run crash-handler smoke
        run: make test-crash-handler

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-artifacts
          path: tests/artifacts/
          if-no-files-found: ignore

  quarantine-age:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check quarantine entries are within the 30-day window
        run: make test-quarantine-age

  fuzz-vterm-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_VTERM_SMOKE_RUNS: 1000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run vterm fuzz smoke
        run: make fuzz-vterm-smoke

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-vterm-crashes
          path: crash-*
          if-no-files-found: ignore

  fuzz-lsp-smoke:
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=0
      FUZZ_LSP_SMOKE_RUNS: 5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Run LSP framing fuzz smoke
        run: make fuzz-lsp-smoke

      - name: Upload crash inputs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-lsp-crashes
          path: crash-*
          if-no-files-found: ignore
